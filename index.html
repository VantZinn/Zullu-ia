<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Zulu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="overlay" class="overlay"></div>

<aside id="drawer" class="drawer">
  <div class="drawerTop">
    <div class="brand">
      <img src="zulu-avatar.png" alt="Zulu">
      <div><strong>Zulu</strong><span>V&D Digital</span></div>
    </div>
    <button id="closeDrawer" class="iconBtn">×</button>
  </div>

  <button id="newChatBtn" class="newChat">＋ Novo chat</button>

  <div class="drawerSection">
    <div class="sectionTitle">Histórico</div>
    <div id="chatList" class="chatList"></div>
  </div>

  <div class="drawerBottom">
    <button id="memoryBtn" class="menuRow">🧠 <span>Memória</span><small>Informações de todos os chats</small></button>
  </div>
</aside>

<main class="shell">
  <header class="topbar">
    <button id="menuBtn" class="menuBtn" aria-label="Menu">=</button>
    <div class="titleWrap">
      <img src="zulu-avatar.png" class="avatar" alt="Zulu">
      <div>
        <div class="title">Zulu</div>
        <div id="status" class="status">Conectando...</div>
      </div>
    </div>
    <button id="newTopBtn" class="iconBtn">＋</button>
  </header>

  <section id="messages" class="messages"></section>

  <div class="composerWrap">
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Converse com a Zulu..."></textarea>
      <button id="sendBtn" type="submit" class="sendBtn">➤</button>
    </form>
    <div class="hint">Zulu pode cometer erros. Confira informações importantes.</div>
  </div>
</main>

<section id="memoryPanel" class="sheet">
  <div class="sheetHead">
    <div><h2>Memória da Zulu</h2><p>Informações reunidas de todos os seus chats.</p></div>
    <button id="closeMemory" class="iconBtn">×</button>
  </div>
  <div id="memoryList" class="memoryList"></div>
</section>

<section id="nameModal" class="modal">
  <div class="modalCard">
    <img src="zulu-avatar.png" alt="Zulu" class="heroAvatar">
    <h1>Oi! Eu sou a Zulu 💜</h1>
    <p>Antes da gente começar, como você gostaria que eu te chamasse?</p>
    <input id="nameInput" maxlength="60" placeholder="Seu nome ou apelido">
    <button id="saveNameBtn">Continuar</button>
  </div>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
